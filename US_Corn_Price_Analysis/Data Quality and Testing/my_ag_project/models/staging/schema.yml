version: 2

sources:
  - name: us_corn_data_source
    database: us-corn-data
    schema: us_corn_data
    tables:
      - name: us_corn_supply_demand
      - name: us_corn_plantings
      - name: us_corn_conditions
      - name: us_climate_data
      - name: us_corn_prices

models:
  # --- Layer 1: Source Fidelity Checks ---
  - name: stg_wasde
    columns:
      - name: year
        tests:
          - unique
          - not_null
      - name: planted_acres
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 70"
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_supply_bushels >= total_usage_bushels"

  - name: stg_weather
    columns:
      - name: precip
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: stg_condition
    columns:
      - name: condition_index
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                # [FIX] This tells dbt to treat them as Numbers (1), not Strings ('1')
                quote: false

  # --- Layer 2: Intermediate Calculation Checks ---
  - name: int_annual_aggregates
    columns:
      - name: planting_50pct_doy
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 360
      - name: avg_condition_index
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5