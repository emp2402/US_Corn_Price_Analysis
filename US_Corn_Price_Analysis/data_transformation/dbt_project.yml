name: 'corn_market_project'
version: '1.0.0'
config-version: 2

# This must match the 'profile' key in profiles.yml
profile: 'corn_market_project'

# Directory configuration
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by 'dbt clean'
  - "target"
  - "dbt_packages"

# Configuring models
models:
  corn_market_project:
    # Config for all models in this project
    # Materialize as tables (better for final data) or views
    +materialized: table # This instructs dbt to delete old data marts and rebuild them in BigQuery